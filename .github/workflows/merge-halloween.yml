name: Scheduled Merge Halloween Hero to Main

on:
  schedule:
    # 7:00 PM IST is 13:30 UTC on October 30
    - cron: '30 13 30 10 *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin main
          git fetch origin halloween-hero

      - name: Pull latest main (including any CMS updates)
        run: |
          git checkout main
          git pull origin main

      - name: Merge halloween-hero into main
        run: |
          git merge origin/halloween-hero -m "Deploy: Merge halloween-hero into main"

      - name: Push to main
        run: |
          for i in {1..3}; do
            git push origin main && break || {
              echo "Concurrent commit detected, pulling latest and retrying..."
              git pull origin main --no-rebase -m "Merge concurrent CMS update"
            }
          done
